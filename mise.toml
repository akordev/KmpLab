# Toolchain pins for KmpLab.
# JDK 21 rather than the machine default (26): AGP 9.3 and Kotlin 2.4 are not
# validated against 26, and the Android toolchain rejects it outright.
[tools]
java = "temurin-21"
gradle = "9.7.0"
# Tuist's manifest API moves between versions, so generation must not depend on
# whatever brew last installed.
tuist = "4.205.0"

# One command on a fresh clone. Gradle has to run first: ios/sdk/Project.swift
# names the XCFramework as a dependency, and `tuist generate` refuses to build a
# graph whose xcframework is missing.
[tasks.setup]
description = "Build the Kotlin XCFramework and generate the Xcode workspace"
run = [
    "./gradlew :shared:network:linkKmpLabNetworkDebugXCFramework",
    "tuist generate --path ios --no-open",
]
